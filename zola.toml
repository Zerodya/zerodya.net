base_url = "https://zerodya.net"
title = "Zerodya"
description = ""
author = "Zerodya"
theme = "hacker"

compile_sass = true
minify_html = true
generate_feeds = true

taxonomies = [{ name = "tags" }]

[markdown]
bottom_footnotes = true
render_emoji = true
external_links_target_blank = true # adds rel="noopener" too

[markdown.highlighting]
theme = "dark-plus"

[extra]
title_separator = "|"
language_code = "en-US"
timezone = "Europe/Rome"
opengraph = true
edit_page = false

menu = [
  { url = "/", name = "~/posts" },
  { url = "/whoami", name = "~/whoami" },
  { url = "/contact", name = "~/contact" },
  { url = "/repo", name = "~/repo" },
]

social_links = [
  { platform = "github", user_id = "Zerodya" },
  { platform = "feed", user_id = true },
]

[extra.github]
username = "Zerodya"
repo = "zerodya.net"

# Comments on posts, stored as discussions in Zerodya/comments
[extra.giscus]
repo = "Zerodya/comments"
repo_id = "R_kgDOHlibvQ"
category = "Announcements"
category_id = "DIC_kwDOHlibvc4CZDfq"
mapping = "og:title" # matches the discussion titles from the old site
strict = 0
reactions_enabled = 1
emit_metadata = 0
input_position = "top"
theme = "transparent_dark"
lang = "en"
loading = "lazy"
crossorigin = "anonymous"
